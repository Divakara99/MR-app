# PharmaSales Jobs is a Vite application. Netlify must build the project and
# publish the generated dist folder, not the repository/source folder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The application uses client-side page state and OAuth return parameters at
# the site root. Let the compiled SPA handle non-file routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Baseline browser protections for every page and asset. The policy keeps the
# app on its own origin, allows Supabase Auth/data connections and external
# HTTPS images/media used by listings/profile content, and prevents the site
# from being embedded in another site.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://*.supabase.co"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

# Always fetch the newest service worker so a corrected deployment is not
# hidden behind an old PWA cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Vite asset filenames contain content hashes and can be cached aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
