<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function (a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('WebSocket') !== -1 && (msg.indexOf('vite') !== -1 || msg.indexOf('closed') !== -1))
          ) {
            // Suppress benign Vite HMR WebSocket connection failure in proxy/iframe environment
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MR Vacancies Hub</title>
    <meta name="description" content="Progressive Web App for Medical Representatives (MRs) seeking verified pharma job vacancies. Featuring subscription tiers, masked contact access, PWA installation, and recruiter management by M Divakar Reddy." />
    <meta property="og:title" content="MR Vacancies Hub" />
    <meta property="og:description" content="Progressive Web App for Medical Representatives (MRs) seeking verified pharma job vacancies. Featuring subscription tiers, masked contact access, PWA installation, and recruiter management by M Divakar Reddy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MR Vacancies" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Gracefully handle benign Vite HMR WebSocket connection drops in iframe/sandbox preview
      window.addEventListener('error', function (e) {
        if (
          e.message && (
            e.message.indexOf('WebSocket') !== -1 ||
            e.message.indexOf('@vite') !== -1
          )
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
        if (reason && reason.indexOf('WebSocket') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#f0f7ff] text-slate-900 antialiased selection:bg-sky-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
